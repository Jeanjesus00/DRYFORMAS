<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07162f"><link rel="manifest" href="manifest.json"><title>DRYFORMAS NA MEDIDA</title><style>
:root{--navy:#07162f;--blue:#0b73ff;--blue2:#1e8cff;--bg:#f4f7fb;--card:#fff;--text:#10213d;--muted:#6b7890;--line:#dce3ee;--ok:#18a66a;--danger:#d64545}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}.hero{background:linear-gradient(145deg,#06132c,#0b2a58);color:white;border-radius:0 0 28px 28px;padding:26px 20px 24px;box-shadow:0 8px 25px #07162f22}.hero img{width:76px;height:76px;object-fit:contain;background:white;border-radius:18px;padding:7px}.hero h1{font-size:24px;margin:14px 0 5px;letter-spacing:.2px}.hero p{margin:0;color:#c8d7ee}.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 4px 14px #0a23400a}.service{min-height:130px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.service .ico{font-size:28px}.service strong{font-size:17px}.service span{color:var(--muted);font-size:13px}.primary{background:var(--blue);color:white;border-radius:13px;padding:13px 16px;font-weight:700;width:100%}.secondary{background:#eaf2ff;color:#075fd1;border-radius:13px;padding:12px 15px;font-weight:700}.ghost{background:transparent;color:var(--blue);font-weight:700}.top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px}.title{font-size:23px;font-weight:800}.sub{color:var(--muted);font-size:14px;margin-top:4px}.section{margin:15px 0}.section h3{font-size:15px;margin:0 0 9px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text);outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{background:#eef4fb}.table td.num{text-align:right;white-space:nowrap}.price{width:92px!important;padding:8px!important}.pill{display:inline-block;background:#eaf2ff;color:#075fd1;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.total{font-size:28px;font-weight:900}.quoteHead{display:flex;align-items:center;gap:12px}.quoteHead img{width:64px;height:64px;object-fit:contain;border-radius:14px;background:white;padding:5px}.muted{color:var(--muted)}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:520px;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}.nav{background:none;color:#748199;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav b{font-size:21px}.nav.active{color:var(--blue);font-weight:800}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#10213d;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20;font-size:13px}.danger{color:var(--danger)}.mini{font-size:12px;color:var(--muted)}@media print{.bottom,.noPrint,.back{display:none!important}.app{max-width:none;padding:0}.content{padding:0}.hero{border-radius:0;box-shadow:none}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const logo='logo.png';
let state=JSON.parse(localStorage.getItem('dfnm_v3')||'null')||{settings:{empresa:'DRYFORMAS NA MEDIDA',telefone:'',cidade:'',waste:5,barLen:3},history:[],draft:null};
const save=()=>localStorage.setItem('dfnm_v3',JSON.stringify(state));
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function nav(active){return `<div class="bottom"><button class="nav ${active==='home'?'active':''}" onclick="home()"><b>⌂</b>Início</button><button class="nav ${active==='budgets'?'active':''}" onclick="historyPage()"><b>▣</b>Orçamentos</button><button class="nav ${active==='settings'?'active':''}" onclick="settings()"><b>⚙</b>Config.</button></div>`}
function shell(content,active='home'){return `<div class="app">${content}${nav(active)}</div>`}
function home(){document.querySelector('#app').innerHTML=shell(`<div class="hero"><img src="${logo}"><h1>DRYFORMAS NA MEDIDA</h1><p>Seu projeto, na medida certa!</p></div><div class="content"><div class="grid"><button class="card service" onclick="start('forro')"><span class="ico">▰</span><strong>FORRO</strong><span>Drywall, PVC e Mineral Modular</span></button><button class="card service" onclick="start('parede')"><span class="ico">▥</span><strong>PAREDE / DIVISÓRIA</strong><span>Drywall e Eucatex Divilux</span></button><button class="card service" onclick="historyPage()"><span class="ico">▤</span><strong>MEUS ORÇAMENTOS</strong><span>Consultar e reabrir</span></button><button class="card service" onclick="settings()"><span class="ico">⚙</span><strong>CONFIGURAÇÕES</strong><span>Empresa, desperdício e barras</span></button></div><div class="card" style="margin-top:16px"><b>Base do aplicativo</b><p class="mini">Quantidades comerciais em peças, barras e unidades. O desperdício padrão é 5% e pode ser alterado em cada cálculo.</p></div></div>`)}
function start(kind){let title=kind==='forro'?'Tipo de Forro':'Parede / Divisória';let opts=kind==='forro'?[['drywall','Gesso Drywall F530','Chapa 1,20 × 1,80 m'],['pvc','PVC','Régua de 6 m'],['mineral','Mineral Modular','Módulo 1,25 × 0,62 m']]:[['dw-wall','Parede/Divisória Drywall','Montantes, guias e chapas'],['divilux','Eucatex Divilux','Painéis e perfis'],['divilux-glass','Eucatex Divilux + vidro','Painéis, perfis e vidro']];document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><button class="back" onclick="home()">‹</button><div><div class="title">${title}</div><div class="sub">Escolha o sistema</div></div></div>${opts.map(o=>`<button class="card" style="width:100%;margin:8px 0;text-align:left" onclick="measure('${o[0]}')"><span class="pill">${o[1]}</span><h3 style="margin:10px 0 4px">${o[2]}</h3><span class="mini">Continuar para medidas →</span></button>`).join('')}</div>`)}
function measure(type){let wall=type.includes('wall')||type.startsWith('divilux');document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><button class="back" onclick="start('${wall?'parede':'forro'}')">‹</button><div><div class="title">Medidas</div><div class="sub">${label(type)}</div></div></div><div class="card"><div class="row"><div class="field"><label>${wall?'Largura':'Largura'} (m)</label><input id="w" type="number" min="0" step="0.01" placeholder="Ex.: 8"></div><div class="field"><label>${wall?'Altura':'Comprimento'} (m)</label><input id="h" type="number" min="0" step="0.01" placeholder="Ex.: 2.8"></div></div><div class="field"><label>Desperdício (%)</label><input id="wa" type="number" min="0" step="0.5" value="${state.settings.waste}"></div>${wall?`<div class="field"><label>Portas</label><input id="doors" type="number" min="0" step="1" value="0"></div>`:''}${type==='divilux-glass'?`<div class="row"><div class="field"><label>Módulos de vidro (qtd.)</label><input id="glassQ" type="number" min="0" step="1" value="0"></div><div class="field"><label>Vidro por módulo (m²)</label><input id="glassM" type="number" min="0" step="0.01" value="0"></div></div>`:''}${type==='drywall'?`<div class="field"><label>Comprimento da barra estrutural (m)</label><input id="bar" type="number" min="1" step="0.1" value="${state.settings.barLen}"></div>`:''}</div><button class="primary" style="margin-top:14px" onclick="calculate('${type}')">CALCULAR MATERIAIS</button></div>`)}
function label(t){return ({drywall:'Gesso Drywall F530',pvc:'PVC',mineral:'Mineral Modular','dw-wall':'Parede/Divisória Drywall',divilux:'Eucatex Divilux','divilux-glass':'Eucatex Divilux + vidro'})[t]}
function calculate(type){let w=+$('#w').value,h=+$('#h').value,wa=+$('#wa').value/100||0;if(!(w>0&&h>0)){toast('Informe as medidas');return}let area=w*h, f=1+wa, materials=[];const add=(name,qty,unit,price=0)=>materials.push({name,qty:Math.ceil(qty*100)/100,unit,price});let bar=+($('#bar')?.value||state.settings.barLen)||3;
if(type==='drywall'){add('Chapa de Drywall 1,20 × 1,80 m',Math.ceil(area/2.16*f),'peças');add('Perfil F530',Math.ceil((area*2.0*f)/bar),'barras');add('Tirante / Pendurais',Math.ceil(area*1.5*f),'unidades');add('Cantoneira de acabamento',Math.ceil((2*(w+h)*f)/bar),'barras');add('Parafuso para Drywall',Math.ceil(area*15*f),'unidades');add('Parafuso Metal-Metal / Ponta Agulha',Math.ceil(area*4*f),'unidades');add('Fita telada',Math.ceil(area*.8*f),'m');add('Massa',Math.ceil(area*.5*f),'kg');}
if(type==='pvc'){add('Régua PVC 6 m',Math.ceil(area/(6*.20)*f),'régua');add('Estrutura de sustentação',Math.ceil((area*2.5*f)/bar),'barras');add('Cantoneira / acabamento',Math.ceil((2*(w+h)*f)/bar),'barras');add('Fixações',Math.ceil(area*6*f),'unidades');}
if(type==='mineral'){add('Placa Mineral 1,25 × 0,62 m',Math.ceil(area/.775*f),'peças');add('Perfil principal',Math.ceil((area*.84*f)/bar),'barras');add('Perfil secundário',Math.ceil((area*1.68*f)/bar),'barras');add('Suspensão / tirante',Math.ceil(area*1.5*f),'unidades');add('Cantoneira',Math.ceil((2*(w+h)*f)/bar),'barras');}
if(type==='dw-wall'){add('Chapa de Drywall 1,20 × 1,80 m',Math.ceil((2*area/2.16)*f),'peças');add('Guia 48/70/90 mm',Math.ceil((2*w*f)/bar),'barras');add('Montante 48/70/90 mm',Math.ceil((Math.ceil(w/.60)*h*f)/bar),'barras');add('Parafuso GN25',Math.ceil(area*20*f),'unidades');add('Parafuso Metal-Metal / Ponta Broca',Math.ceil(area*4*f),'unidades');add('Fita para junta',Math.ceil(area*1.2*f),'m');add('Massa para junta',Math.ceil(area*.8*f),'kg');}
if(type.startsWith('divilux')){add('Painel Eucatex Divilux 1,202 × 2,110 m',Math.ceil((w/1.202)*f),'peças');add('Montante e Travessa',Math.ceil((2*w*f)/bar),'barras');add('Guia Inferior',Math.ceil((w*f)/bar),'barras');add('Batente de Porta',Math.ceil((+($('#doors')?.value||0))*1),'peças');add('Testeira de Porta',Math.ceil((+($('#doors')?.value||0))*1),'peças');add('Perfil para Leito de Vidro',Math.ceil((w*f)/bar),'barras');add('Baguete para Vidro',Math.ceil((w*f)/bar),'barras');if(type==='divilux-glass'){let q=+$('#glassQ').value||0,m=+$('#glassM').value||0;add('Vidro',q*m*f,'m²')}add('Parafusos e Fixações',Math.ceil(area*6*f),'unidades');}
state.draft={type,w,h,area,waste:wa*100,materials,doors:+($('#doors')?.value||0)};save();prices();}
function prices(){let d=state.draft;document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><button class="back" onclick="measure('${d.type}')">‹</button><div><div class="title">Materiais e Preços</div><div class="sub">${label(d.type)} • ${fmt(d.area)} m² • ${d.waste}% desperdício</div></div></div><div class="card" style="padding:8px"><table class="table"><thead><tr><th>Material</th><th>Qtd.</th><th>Preço</th></tr></thead><tbody>${d.materials.map((m,i)=>`<tr><td>${m.name}<div class="mini">${m.unit}</div></td><td class="num">${fmt(m.qty)}</td><td class="num"><input class="price" type="number" min="0" step="0.01" value="${m.price}" onchange="setPrice(${i},this.value)"></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:12px"><div class="row"><div class="field"><label>Mão de obra</label><input id="labor" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Desconto</label><input id="disc" type="number" min="0" step="0.01" value="0"></div></div><button class="primary" onclick="quote()">MONTAR ORÇAMENTO</button></div></div>`)}
function setPrice(i,v){state.draft.materials[i].price=+v;save()}
function quote(){let d=state.draft;d.labor=+$('#labor').value||0;d.discount=+$('#disc').value||0;d.client='';d.work='';save();quotePage()}
function quotePage(){let d=state.draft,mat=d.materials.reduce((s,m)=>s+m.qty*m.price,0),total=Math.max(0,mat+(d.labor||0)-(d.discount||0));document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><button class="back" onclick="prices()">‹</button><div><div class="title">Orçamento Final</div><div class="sub">Revise antes de gerar o PDF</div></div></div><div class="card"><div class="quoteHead"><img src="${logo}"><div><b>${state.settings.empresa||'DRYFORMAS NA MEDIDA'}</b><div class="mini">${state.settings.telefone||''}</div></div></div><div class="field"><label>Cliente</label><input id="client" value="${d.client||''}" placeholder="Nome do cliente"></div><div class="field"><label>Obra</label><input id="work" value="${d.work||''}" placeholder="Local / descrição da obra"></div><hr style="border:0;border-top:1px solid var(--line)"><p class="mini">Materiais</p>${d.materials.map(m=>`<div style="display:flex;justify-content:space-between;gap:10px;margin:8px 0"><span>${m.name}<br><small class="muted">${fmt(m.qty)} ${m.unit}</small></span><b>${money(m.qty*m.price)}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><span>Materiais</span><b>${money(mat)}</b></div><div style="display:flex;justify-content:space-between"><span>Mão de obra</span><b>${money(d.labor)}</b></div><div style="display:flex;justify-content:space-between"><span>Desconto</span><b>- ${money(d.discount)}</b></div><div style="display:flex;justify-content:space-between;margin-top:12px"><span>Total</span><span class="total">${money(total)}</span></div></div><button class="primary noPrint" style="margin-top:12px" onclick="saveQuote()">SALVAR ORÇAMENTO</button><button class="secondary noPrint" style="width:100%;margin-top:8px" onclick="printQuote()">GERAR / IMPRIMIR PDF</button></div>`)}
function saveQuote(){let d=state.draft;d.client=$('#client').value;d.work=$('#work').value;let mat=d.materials.reduce((s,m)=>s+m.qty*m.price,0);d.total=Math.max(0,mat+(d.labor||0)-(d.discount||0));d.created=new Date().toISOString();state.history.unshift(JSON.parse(JSON.stringify(d)));state.history=state.history.slice(0,100);save();toast('Orçamento salvo');setTimeout(historyPage,500)}
function printQuote(){let d=state.draft;d.client=$('#client').value;d.work=$('#work').value;save();window.print()}
function historyPage(){document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><div><div class="title">Meus Orçamentos</div><div class="sub">Histórico salvo neste iPhone</div></div></div>${state.history.length?state.history.map((d,i)=>`<button class="card" style="width:100%;margin:8px 0;text-align:left" onclick="openHistory(${i})"><b>${d.client||'Cliente não informado'}</b><div class="mini">${d.work||label(d.type)} • ${new Date(d.created).toLocaleDateString('pt-BR')}</div><div style="margin-top:8px;font-size:18px;font-weight:800">${money(d.total||0)}</div></button>`).join(''):`<div class="card empty">Nenhum orçamento salvo ainda.<br><button class="ghost" onclick="home()">Criar primeiro orçamento</button></div>`}</div>`,'budgets')}
function openHistory(i){state.draft=JSON.parse(JSON.stringify(state.history[i]));save();quotePage()}
function settings(){document.querySelector('#app').innerHTML=shell(`<div class="content"><div class="top"><button class="back" onclick="home()">‹</button><div><div class="title">Configurações</div><div class="sub">Dados usados nos orçamentos</div></div></div><div class="card"><div class="field"><label>Nome da empresa</label><input id="empresa" value="${state.settings.empresa}"></div><div class="field"><label>Telefone</label><input id="tel" value="${state.settings.telefone}"></div><div class="field"><label>Cidade / UF</label><input id="cidade" value="${state.settings.cidade}"></div><div class="row"><div class="field"><label>Desperdício padrão (%)</label><input id="waste" type="number" min="0" step="0.5" value="${state.settings.waste}"></div><div class="field"><label>Barra padrão (m)</label><input id="barLen" type="number" min="1" step="0.1" value="${state.settings.barLen}"></div></div><button class="primary" onclick="saveSettings()">SALVAR CONFIGURAÇÕES</button></div><div class="card" style="margin-top:12px"><b>Importante</b><p class="mini">As quantidades comerciais desta versão estão organizadas para o seu modo de compra. Os coeficientes de consumo precisam ser conferidos com as tabelas técnicas do sistema antes de tratar o cálculo como medição técnica definitiva.</p></div></div>`,'settings')}
function saveSettings(){state.settings={empresa:$('#empresa').value,telefone:$('#tel').value,cidade:$('#cidade').value,waste:+$('#waste').value||5,barLen:+$('#barLen').value||3};save();toast('Configurações salvas');setTimeout(home,500)}
function sw(){if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}sw();home();
</script></body></html>
